<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Tierstimmen‑Übersetzer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>🐶🐱 Tierstimmen‑Übersetzer</h1>
    </header>

    <main>
        <section id="controls">
            <button id="startBtn">Aufnahme starten</button>
            <button id="stopBtn" disabled>Aufnahme stoppen</button>
        </section>

        <section id="result">
            <h2>Ergebnis</h2>
            <p id="translation">–</p>
            <audio id="playback" controls style="display:none;"></audio>
        </section>

        <section id="history">
            <h2>Verlauf</h2>
            <ul id="historyList"></ul>
        </section>
    </main>

    <script src="app.js"></script>
</body>
</html>
